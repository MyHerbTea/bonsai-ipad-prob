name: BonsaiLab

options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

packages:
  MLXSwift:
    url: https://github.com/ml-explore/mlx-swift
    exactVersion: 0.31.3

targets:
  BonsaiLab:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BonsaiLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.bonsai.lab.v1
        PRODUCT_NAME: BonsaiLab
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "63"
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_MACCATALYST: NO
        SWIFT_VERSION: "5.0"
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        SWIFT_OBJC_BRIDGING_HEADER: "BonsaiLab/MTMDProbeBridge.h"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        INFOPLIST_KEY_CFBundleDisplayName: "Bonsai"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Bonsai 可在你的局域网内提供本地 OpenAI 兼容 API。"
    dependencies:
      - framework: Vendor/llama.xcframework
        embed: true
        codeSign: false
      - package: MLXSwift
        product: MLX
      - package: MLXSwift
        product: MLXNN
      - sdk: Accelerate.framework
      - sdk: Metal.framework
      - sdk: Network.framework
      - sdk: Foundation.framework
      - sdk: libc++.tbd

schemes:
  BonsaiLab:
    build:
      targets:
        BonsaiLab: all
    run:
      config: Debug
    archive:
      config: Release

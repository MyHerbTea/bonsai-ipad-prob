name: Bonsai 32K Certification Windows Runner P0
on:
  push:
    branches:
      - lab-v1-rc1-26-certification-p0-windows-runner
    paths:
      - "device_tests/**"
      - ".github/workflows/certification-p0.yml"
      - "docs/backburner-integration/RC126_BUILD89_CERTIFICATION_P0.md"
  workflow_dispatch:
jobs:
  runner-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python
        run: python -m py_compile device_tests/certify.py device_tests/test_certify.py
      - name: Loopback mock API and redaction contracts
        run: python -m unittest discover -s device_tests -p "test_*.py" -v
      - name: Assert Build89 frozen product files remain unchanged
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet 4245e99767c1f09b5b07efe636ebc45a29b1ec61 HEAD -- \
            BonsaiLab/ .github/workflows/build-ios.yml project.yml \
            tools/rc126_build89_patch_prism_compact_scheduler.py
          echo "P0 Build89 source isolation: PASS"
      - name: Package sanitized Windows runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/BonsaiBuild89CertificationP0
          cp device_tests/certify.py \
             device_tests/config.example.json \
             device_tests/RUN_SMOKE.cmd \
             device_tests/README.md \
             dist/BonsaiBuild89CertificationP0/
          cd dist
          zip -qry BonsaiBuild89CertificationP0.zip BonsaiBuild89CertificationP0
          test -s BonsaiBuild89CertificationP0.zip
          shasum -a 256 BonsaiBuild89CertificationP0.zip
      - name: Publish Windows test runner
        uses: actions/upload-artifact@v4
        with:
          name: BonsaiBuild89-Certification-P0-WindowsRunner
          path: dist/BonsaiBuild89CertificationP0.zip
          retention-days: 30

  windows-compatibility:
    name: Windows Python ${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify Windows interpreter
        run: python --version
      - name: Python syntax smoke
        run: python -m py_compile device_tests/certify.py device_tests/test_certify.py
      - name: Loopback HTTP and SSE validation on Windows
        run: python -m unittest discover -s device_tests -p "test_*.py" -v

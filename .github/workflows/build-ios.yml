name: Build Bonsai iPad Lab v1 RC1.26 Build 98 M5 FA-vec A/B

on:
  push:
    branches:
      - main
      - lab-v1-rc1-23-1-openai-multimodal-api
      - lab-v1-rc1-23-2-performance-session-reuse
      - lab-v1-rc1-23-3-production-hardening
      - lab-v1-rc1-23-4-generation-decode-efficiency
      - lab-v1-rc1-23-5-ttft-suffix-prefill-efficiency
      - lab-v1-rc1-23-6-api-runtime-lifecycle-restart-safety
      - lab-v1-rc1-24-0-sustained-decode-profiling
      - lab-v1-rc1-24-1-build56-runtime-profile-ab
      - lab-v1-rc1-25-0-multi-image-openai-api
      - lab-v1-rc1-25-1-observability-error-hardening
      - lab-v1-rc1-25-2-openai-api-usability
      - lab-v1-rc1-25-3-build64-native-prefill-isolation
      - lab-v1-rc1-26-backburner-runtime
      - lab-v1-rc1-26-build82-unified-metal
      - lab-v1-rc1-26-build82-unified-metal-v2
      - lab-v1-rc1-26-build82-unified-metal-v3
      - lab-v1-rc1-26-build83-prism-kv-sharding
      - lab-v1-rc1-26-build84-native-context-crash-isolation
      - lab-v1-rc1-26-build85-scheduler-reserve-isolation
      - lab-v1-rc1-26-build86-crash-forensics-v2
      - lab-v1-rc1-26-build87-scheduler-context-guard
      - lab-v1-rc1-26-build88-scheduler-mmap-recovery
      - lab-v1-rc1-26-build89-compact-scheduler-metadata
      - lab-v1-rc1-26-build90-certification-p1
      - lab-v1-rc1-26-build91-long-context-forensics
      - lab-v1-rc1-26-build92-native-prefill-observability
      - lab-v1-rc1-26-build93-prefill-batch8-ab
      - lab-v1-rc1-26-build98-m5-fa-vec-ab
      - lab-v1-rc1-26-build98-m5-fa-vec-ab
  workflow_dispatch:

concurrency:
  group: bonsai-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build93 and Build94 executable rollback lifecycle and integration contracts
        shell: bash
        run: |
          set -euo pipefail
          xcrun swiftc -DDEBUG -swift-version 5 \
            BonsaiLab/Build93BatchTrialPolicy.swift \
            tools/rc126_build93_policy_tests.swift \
            -o "$RUNNER_TEMP/build93_policy_tests"
          "$RUNNER_TEMP/build93_policy_tests"
          python3 tools/rc126_build93_contract_tests.py
          xcrun swiftc -DDEBUG -swift-version 5 \
            BonsaiLab/Build93BatchTrialPolicy.swift \
            BonsaiLab/Build94BatchExperiment.swift \
            tools/rc126_build94_policy_tests.swift \
            -o "$RUNNER_TEMP/build94_policy_tests"
          "$RUNNER_TEMP/build94_policy_tests"
          python3 tools/rc126_build94_contract_tests.py
          python3 tools/rc126_build97_output_vision_contract_tests.py

      - name: Live vision injection gate
        shell: bash
        run: |
          set -euo pipefail
          # RC1.16 intentionally changes the native bridge. Protect the
          # inherited RC1.15 lifecycle contract instead of requiring byte identity.
          grep -q 'unloadAll(releaseStagedResident: false)' BonsaiLab/BonsaiEngine.swift
          grep -q 'release_resident_context_locked' BonsaiLab/StagedVisionBridge.mm
          grep -q 'resident_model_hit' BonsaiLab/StagedVisionBridge.h
          grep -q 'STAGED_10_MODEL_KEPT_RESIDENT' BonsaiLab/StagedVisionBridge.mm
          grep -q 'cache_hit' BonsaiLab/StagedVisionBridge.h
          grep -q 'resident_context_hit' BonsaiLab/StagedVisionBridge.h
          grep -q 'kv_reuse_hit' BonsaiLab/StagedVisionBridge.h
          grep -q 'STAGED_07_CONTEXT_RESIDENT_HIT' BonsaiLab/StagedVisionBridge.mm
          grep -q 'STAGED_10_CONTEXT_KEPT_RESIDENT_KV_REUSED' BonsaiLab/StagedVisionBridge.mm
          grep -q 'residentContextHit' BonsaiLab/LabTypes.swift
          grep -q 'kvReuseHit' BonsaiLab/LabTypes.swift
          grep -q 'BonsaiStagedStreamCallback' BonsaiLab/StagedVisionBridge.h
          grep -q 'stream_callback' BonsaiLab/StagedVisionBridge.mm
          grep -q 'Transfer-Encoding: chunked' BonsaiLab/LocalOpenAIServer.swift
          grep -q 'sendStreamDelta' BonsaiLab/LocalOpenAIServer.swift
          grep -q 'StagedVisionStreamBox' BonsaiLab/BonsaiEngine.swift
          grep -q 'stream=true 真 SSE' BonsaiLab/ProductionView.swift
          grep -q 'ResourceGovernorState' BonsaiLab/LabTypes.swift
          grep -q 'RESOURCE_10_RESIDENT_RELEASED' BonsaiLab/BonsaiEngine.swift
          grep -q 'RESOURCE_20_VISION_DOWNGRADE_768' BonsaiLab/BonsaiEngine.swift
          grep -q 'resourceGovernorEnabled: false' BonsaiLab/ProductionView.swift
          grep -q 'Transfer-Encoding: chunked' BonsaiLab/LocalOpenAIServer.swift
          grep -q '/v1/models/' BonsaiLab/LocalOpenAIServer.swift
          grep -q 'include_usage' BonsaiLab/LocalOpenAIServer.swift
          grep -q 'finishReason' BonsaiLab/LocalOpenAIServer.swift
          grep -q 'unsupportedTools' BonsaiLab/LocalOpenAIServer.swift
          grep -q 'Transfer-Encoding: chunked' BonsaiLab/LocalOpenAIServer.swift
          grep -q 'ResourceGovernorState' BonsaiLab/LabTypes.swift
          grep -q 'warmSessionSummary' BonsaiLab/ProductionView.swift
          grep -q 'warm.residentContextHit' BonsaiLab/ProductionView.swift
          grep -q 'warm.kvReuseHit' BonsaiLab/ProductionView.swift
          grep -q 'UIPasteboard.general.string' BonsaiLab/ProductionView.swift
          grep -q 'MARKETING_VERSION: "1.0.0"' project.yml
          grep -q 'CURRENT_PROJECT_VERSION: "98"' project.yml
          grep -q 'reasoningEffort' BonsaiLab/BonsaiEngine.swift
          grep -q 'payload.reasoningEffort' BonsaiLab/ProductionView.swift
          grep -q '<think>\\n\\n</think>\\n\\n' BonsaiLab/BonsaiEngine.swift
          grep -q 'default_reasoning_effort' BonsaiLab/LocalOpenAIServer.swift
          grep -q 'payload.maxTokens,' BonsaiLab/ProductionView.swift
          grep -q '256' BonsaiLab/ProductionView.swift
          grep -q 'BonsaiPrepareVisionCache' BonsaiLab/StagedVisionBridge.h
          grep -q 'BonsaiPrefillCachedVision' BonsaiLab/StagedVisionBridge.h
          grep -q 'TWOPHASE_A99_CACHE_READY' BonsaiLab/StagedVisionBridge.mm
          grep -q 'TWOPHASE_B99_PREFILL_READY' BonsaiLab/StagedVisionBridge.mm
          grep -q 'prepareVisionEmbeddingCache' BonsaiLab/BonsaiEngine.swift
          grep -q 'generateCachedVision' BonsaiLab/BonsaiEngine.swift
          grep -q 'releasedTextRuntime' BonsaiLab/LabTypes.swift
          grep -q 'VisionConfig.low512' BonsaiLab/ProductionView.swift
          grep -q 'Two-Phase Vision' BonsaiLab/ContentView.swift
          grep -q 'bonsai_two_phase_vision_stage.txt' BonsaiLab/ContentView.swift
          grep -q 'TWOPHASE_A00_SCOPE_READY' BonsaiLab/BonsaiEngine.swift
          grep -q 'startAccessingSecurityScopedResource' BonsaiLab/BonsaiEngine.swift
          grep -q 'let cacheURL = try makeVisionCacheURL' BonsaiLab/BonsaiEngine.swift
          grep -q 'TWOPHASE_A110_RESTART_REQUIRED' BonsaiLab/BonsaiEngine.swift
          grep -q 'outHiddenSize: 5_120' BonsaiLab/BonsaiMLXVisionSidecar.swift
          grep -q 'apiServer.isRunning' BonsaiLab/ProductionView.swift
          grep -q 'MLX Vision Stage' BonsaiLab/ContentView.swift
          grep -q 'MLX_ADMIT_01_TENSOR_SMOKE_BEGIN' BonsaiLab/BonsaiMLXVisionSidecar.swift
          grep -q 'stream: .cpu' BonsaiLab/BonsaiMLXVisionSidecar.swift
          grep -q 'runHardCutBlock' BonsaiLab/BonsaiMLXVisionSidecar.swift
          grep -q 'output.asData(access: .copy)' BonsaiLab/BonsaiMLXVisionSidecar.swift
          grep -q 'MLXArray(data: snapshot)' BonsaiLab/BonsaiMLXVisionSidecar.swift
          grep -q 'MLX_CUT_%02d_BEGIN' BonsaiLab/BonsaiMLXVisionSidecar.swift
          grep -q 'MLX_CUT_28_MERGER_BEGIN' BonsaiLab/BonsaiMLXVisionSidecar.swift
          grep -q 'MLX_HARDCUT_99_PASS' BonsaiLab/BonsaiMLXVisionSidecar.swift
          grep -q 'encodeForInjection' BonsaiLab/BonsaiMLXVisionSidecar.swift
          grep -q 'MLX_INJECT_03_PACKET_READY' BonsaiLab/BonsaiMLXVisionSidecar.swift
          grep -q 'BonsaiWriteProjectedVisionCache' BonsaiLab/StagedVisionBridge.h
          grep -q 'MLX_INJECT_12_CACHE_READY' BonsaiLab/StagedVisionBridge.mm
          grep -q 'writeMLXProjectedVisionCache' BonsaiLab/BonsaiEngine.swift
          grep -q 'runLiveVisionInjection' BonsaiLab/ProductionView.swift
          grep -q 'selectedMLXVisionWeightsURL' BonsaiLab/ProductionView.swift
          grep -q 'vision_model_unavailable' BonsaiLab/ProductionView.swift
          grep -q 'vision_inference_failed' BonsaiLab/ProductionView.swift
          grep -q 'vision_injection_failed' BonsaiLab/ProductionView.swift
          grep -q 'context_length_exceeded' BonsaiLab/ProductionView.swift
          grep -q 'requireFullOutputBudget:' BonsaiLab/ProductionView.swift
          grep -q 'cleanupAfterRequestFailure' BonsaiLab/ProductionView.swift
          grep -q 'OpenAIMultimodalNormalizer' BonsaiLab/LocalOpenAIServer.swift
          grep -q 'RC1.26 Build 89 Compact Scheduler Metadata' BonsaiLab/ProductionView.swift
          grep -q 'Live Vision Injection' BonsaiLab/ContentView.swift
          grep -q 'Text("MLX Vision Metrics")' BonsaiLab/ContentView.swift
          grep -q 'maxPixels: Int = 65_536' BonsaiLab/BonsaiMLXVisionSidecar.swift
          grep -q 'Memory.cacheLimit = 20 \* 1_048_576' BonsaiLab/BonsaiMLXVisionSidecar.swift
          grep -q 'Memory.clearCache()' BonsaiLab/BonsaiMLXVisionSidecar.swift
          grep -q 'mlx-swift-lm' BonsaiLab/BonsaiMLXVisionSidecar.swift
          grep -q 'exactVersion: 0.31.3' project.yml
          ! grep -q 'MLXVLM' project.yml
          ! grep -q 'MLXLMCommon' project.yml
          grep -q 'iOS: "17.0"' project.yml
          python3 -m py_compile tools/extract_bonsai_vision_tower.py
          echo "RC1.22.5 MLX vision sidecar + frozen RC1.20.7/RC1.21.2 invariants: PASS"

      - name: Product invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'ProductionView()' BonsaiLab/BonsaiLabApp.swift
          grep -q '/v1/chat/completions' BonsaiLab/LocalOpenAIServer.swift
          grep -q '/v1/models' BonsaiLab/LocalOpenAIServer.swift
          grep -q 'Authorization: Bearer' BonsaiLab/LocalOpenAIServer.swift
          ! grep -q 'min(gen.maxTokens, 64)' BonsaiLab/BonsaiEngine.swift
          grep -q 'runCertification()' BonsaiLab/ProductionView.swift
          grep -q 'scenePhase' BonsaiLab/ProductionView.swift
          grep -q 'apiServer.stop()' BonsaiLab/ProductionView.swift
          grep -q 'imageCacheHit' BonsaiLab/LabTypes.swift
          grep -q 'residentModelHit' BonsaiLab/LabTypes.swift
          echo "Product + session invariants: PASS"

      - name: RC1.23.1 RED/GREEN contracts
        shell: bash
        run: |
          set +e
          status=0

          echo "=== Source contracts ==="
          python3 tools/rc1231_source_contract_tests.py || status=1

          echo "=== Multimodal parser contracts ==="
          if test -f BonsaiLab/OpenAIMultimodal.swift; then
            xcrun swiftc \
              BonsaiLab/OpenAIMultimodal.swift \
              tools/rc1231_multimodal_contract_tests.swift \
              -framework ImageIO \
              -framework CoreGraphics \
              -o /tmp/rc1231_multimodal_contract_tests
            if test "$?" -eq 0; then
              /tmp/rc1231_multimodal_contract_tests || status=1
            else
              status=1
            fi
          else
            echo "RED: BonsaiLab/OpenAIMultimodal.swift does not exist yet"
            status=1
          fi

          exit "$status"

      - name: RC1.23.2 observability contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/rc1232_observability_contract_tests.py

      - name: RC1.23.2 prefix KV reuse contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/rc1232_prefix_reuse_contract_tests.py

      - name: RC1.23.3 long-run observability contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/rc1233_long_run_observability_contract_tests.py

      - name: RC1.23.3 runtime profile A/B contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/rc1233_runtime_profile_contract_tests.py

      - name: RC1.23.4 generation telemetry contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/rc1234_generation_telemetry_contract_tests.py

      - name: RC1.23.5 suffix prefill profiling contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/rc1235_suffix_prefill_profiling_contract_tests.py

      - name: RC1.23.6 certification recorder contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/rc1236_certification_recorder_contract_tests.py

      - name: RC1.23.6 restart runner contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/rc1236_restart_runner_contract_tests.py

      - name: RC1.23.6 recovery export contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/rc1236_recovery_export_contract_tests.py

      - name: RC1.23.6 resident runtime restart contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/rc1236_resident_runtime_restart_contract_tests.py

      - name: RC1.23.6 awaited listener rebind contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/rc1236_awaited_listener_rebind_contract_tests.py

      - name: RC1.23.6 production stop resume contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/rc1236_production_stop_resume_contract_tests.py

      - name: RC1.24.0 sustained decode profiling contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/rc1240_sustained_decode_profiling_contract_tests.py

      - name: RC1.24.1 runtime profile A/B contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/rc1241_runtime_profile_ab_contract_tests.py

      - name: RC1.25.0 multi-image contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/rc1250_multi_image_contract_tests.py
          xcrun swiftc \
            BonsaiLab/OpenAIMultimodal.swift \
            BonsaiLab/OpenAIMultiImageComposer.swift \
            tools/rc1250_multi_image_composer_contract_tests.swift \
            -framework ImageIO \
            -framework CoreGraphics \
            -o /tmp/rc1250_multi_image_composer_contract_tests
          /tmp/rc1250_multi_image_composer_contract_tests

      - name: RC1.25.1 API hardening contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/rc1251_api_hardening_contract_tests.py

      - name: RC1.25.1 native context admission contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/rc1251_context_admission_contract_tests.py

      - name: RC1.25.2 API usability contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/rc1252_api_usability_contract_tests.py

      - name: RC1.25.2 context switch safety contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/rc1252_context_switch_safety_contract_tests.py

      - name: RC1.25.2 vision lifecycle safety contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/rc1252_vision_lifecycle_safety_contract_tests.py

      - name: RC1.25.3 native prefill isolation contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/rc1253_native_prefill_isolation_contract_tests.py

      - name: RC1.26 Phase 0 + Phase 1 contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/rc126_phase0_phase1_contract_tests.py

      - name: RC1.26 automation control contracts

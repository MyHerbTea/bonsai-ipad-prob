      - name: RC1.26 Build 98 isolated M5 FA-vec contract preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/rc126_build98_fa_vec_contract_tests.py

      - name: RC1.26 Build 94 packaging identity preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -c 'CURRENT_PROJECT_VERSION: \"98\"' project.yml)" -ge 1
          grep -q '"rc1.26-build98-m5-fa-vec-ab"' BonsaiLab/LocalOpenAIServer.swift
          grep -q 'RC126APIStartupLifecycle.begin(build: \"98\")' BonsaiLab/ProductionView.swift

          PACKAGE_BLOCK="$(
            sed -n \
              '/^      - name: Package unsigned IPA$/,/^      - name: Upload artifact$/p' \
              .github/workflows/build-ios.yml
          )"

          grep -q 'zip -qry ../BonsaiLab-v1-RC1.26-build98-m5-fa-vec-ab-unsigned.ipa Payload' <<< "$PACKAGE_BLOCK"
          grep -q 'BonsaiLab-v1-RC1.26-build98-m5-fa-vec-ab-unsigned.ipa.sha256' <<< "$PACKAGE_BLOCK"
          if grep -q 'build75-api-cold-start-guard' <<< "$PACKAGE_BLOCK"; then
            echo "ERROR: Build 78 packaging leaked into Build 79 package step." >&2
            exit 1
          fi
          echo "Build 98 packaging identity preflight: PASS"

      - name: Validate Build 79 entitlements source
        shell: bash
        run: |
          set -euo pipefail
          plutil -lint BonsaiLab/BonsaiLab.entitlements
          grep -q 'com.apple.developer.kernel.extended-virtual-addressing' BonsaiLab/BonsaiLab.entitlements
          grep -q 'com.apple.developer.kernel.increased-memory-limit' BonsaiLab/BonsaiLab.entitlements
          grep -q 'CODE_SIGN_ENTITLEMENTS: "BonsaiLab/BonsaiLab.entitlements"' project.yml

      - name: Show Apple toolchain
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          uname -m

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen --version

      - name: Build patched Prism XCFramework
        shell: bash
        run: |
          set -euo pipefail
          PRISM_DIR="/tmp/prism-build89"
          rm -rf "$PRISM_DIR" Vendor/llama.xcframework
          git clone --filter=blob:none https://github.com/PrismML-Eng/llama.cpp.git "$PRISM_DIR"
          git -C "$PRISM_DIR" checkout adfffbe41b2cabcd51fff326ab045662265062bb
          python3 "$GITHUB_WORKSPACE/tools/rc126_build83_patch_prism_kv_sharding.py" "$PRISM_DIR/src/llama-kv-cache.cpp"
          python3 "$GITHUB_WORKSPACE/tools/rc126_build84_patch_prism_native_trace.py" "$PRISM_DIR/src/llama-kv-cache.cpp" "$PRISM_DIR/src/llama-context.cpp"
          python3 "$GITHUB_WORKSPACE/tools/rc126_build85_patch_prism_scheduler_trace.py" "$PRISM_DIR/src/llama-context.cpp"
          python3 "$GITHUB_WORKSPACE/tools/rc126_build86_patch_prism_crash_forensics.py" "$PRISM_DIR/src/llama-context.cpp" "$PRISM_DIR/ggml/src/ggml-backend.cpp"
          python3 "$GITHUB_WORKSPACE/tools/rc126_build87_patch_prism_sched_context.py" "$PRISM_DIR/ggml/src/ggml-backend.cpp"
          python3 "$GITHUB_WORKSPACE/tools/rc126_build88_patch_prism_mmap_recovery.py" "$PRISM_DIR/ggml/src/ggml-backend.cpp" "$PRISM_DIR/src/llama-context.cpp"
          python3 "$GITHUB_WORKSPACE/tools/rc126_build89_patch_prism_compact_scheduler.py" "$PRISM_DIR/ggml/src/ggml-backend.cpp"
          python3 "$GITHUB_WORKSPACE/tools/rc126_build98_patch_prism_fa_vec_ab.py" "$PRISM_DIR/ggml/src/ggml-metal/ggml-metal-ops.cpp"
          grep -q 'BONSAI_BUILD98_FA_VEC_AB' "$PRISM_DIR/ggml/src/ggml-metal/ggml-metal-ops.cpp"
          grep -q 'BUILD89_COMPACT_ALLOC_SUCCESS' "$PRISM_DIR/ggml/src/ggml-backend.cpp"
          grep -q 'BUILD89_META_USED' "$PRISM_DIR/ggml/src/ggml-backend.cpp"
          grep -q 'BUILD88_MMAP_SUCCESS' "$PRISM_DIR/ggml/src/ggml-backend.cpp"
          grep -q 'BUILD88_SCHED_NEW_NULL_CTX_ABORT_PREVENTED' "$PRISM_DIR/src/llama-context.cpp"
          grep -q 'BUILD87_SPLIT_GGML_INIT_BEGIN' "$PRISM_DIR/ggml/src/ggml-backend.cpp"
          grep -q 'BUILD87_SCHED_BUFFER_ALLOC' "$PRISM_DIR/ggml/src/ggml-backend.cpp"
          grep -q 'BUILD86_FUSED_PROBE_BEGIN' "$PRISM_DIR/src/llama-context.cpp"
          grep -q 'BUILD86_SPLIT_PASS5_BEGIN' "$PRISM_DIR/ggml/src/ggml-backend.cpp"
          grep -q 'BUILD86_SPLIT_DONE' "$PRISM_DIR/ggml/src/ggml-backend.cpp"
          grep -q 'BUILD85_SCHED_ENTER' "$PRISM_DIR/src/llama-context.cpp"
          grep -q 'BUILD85_BACKEND_RESERVE_BEGIN' "$PRISM_DIR/src/llama-context.cpp"
          grep -q 'BUILD84_KV_ALLOC_BEGIN' "$PRISM_DIR/src/llama-kv-cache.cpp"
          grep -q 'BUILD84_CTX_MEMORY_BEGIN' "$PRISM_DIR/src/llama-context.cpp"
          grep -q 'BONSAI_BUILD84_TRACE_PATH' "$PRISM_DIR/src/bonsai-build84-trace.h"
          grep -q 'BUILD83_METAL_KV_LAYER_SHARD' "$PRISM_DIR/src/llama-kv-cache.cpp"
          git -C "$PRISM_DIR" diff --check
          cmake --version
          (
            cd "$PRISM_DIR"
            bash ./build-xcframework.sh ios-device
          )
          test -f "$PRISM_DIR/build-apple/llama.xcframework/ios-arm64/llama.framework/llama"
          mkdir -p Vendor
          ditto "$PRISM_DIR/build-apple/llama.xcframework" Vendor/llama.xcframework
          test -f Vendor/llama.xcframework/ios-arm64/llama.framework/llama
          test -f Vendor/llama.xcframework/ios-arm64/llama.framework/Headers/mtmd.h
          test -f Vendor/llama.xcframework/ios-arm64/llama.framework/Headers/mtmd-helper.h

      - name: Embed exact product build identity
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GITHUB_SHA"
          test -n "$GITHUB_RUN_ID"
          cat > BonsaiLab/BonsaiCertificationBuildIdentity.swift <<EOF
          enum BonsaiCertificationBuildIdentity {
              static let sourceGitSHA = "$GITHUB_SHA"
              static let workflowRunID = "$GITHUB_RUN_ID"
          }
          EOF
          grep -q "$GITHUB_SHA" BonsaiLab/BonsaiCertificationBuildIdentity.swift

      - name: Swift syntax preflight
        shell: bash
        run: |
          set -euo pipefail
          for f in BonsaiLab/*.swift; do
            echo "Parsing $f"
            xcrun swiftc -frontend -parse "$f"
          done

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          xcodegen generate
          test -d BonsaiLab.xcodeproj

      - name: Full Xcode build
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild             -project BonsaiLab.xcodeproj             -scheme BonsaiLab             -configuration Release             -sdk iphoneos             -destination 'generic/platform=iOS'             -derivedDataPath "$PWD/build/DerivedData"             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""             DEVELOPMENT_TEAM=""             build | tee build.log

      - name: Verify app and Prism multimodal symbols
        shell: bash
        run: |
          set -euo pipefail
          APP="$PWD/build/DerivedData/Build/Products/Release-iphoneos/BonsaiLab.app"
          FRAMEWORK="$APP/Frameworks/llama.framework/llama"
          test -d "$APP"
          test -f "$APP/BonsaiLab"
          test -f "$FRAMEWORK"
          file "$APP/BonsaiLab"
          file "$FRAMEWORK"
          otool -L "$APP/BonsaiLab"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Info.plist")" = "1.0.0"
          test "$(plutil -extract CFBundleVersion raw -o - "$APP/Info.plist")" = "98"
          nm -gU "$FRAMEWORK" > build/llama-symbols.txt
          grep -q '_mtmd_init_from_file' build/llama-symbols.txt
          grep -q '_mtmd_helper_eval_chunks' build/llama-symbols.txt
          grep -q '_llama_memory_seq_rm' build/llama-symbols.txt
          grep -q 'MLX' build.log
          echo "Prism + minimal MLX sidecar build: PASS"

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="$PWD/build/DerivedData/Build/Products/Release-iphoneos/BonsaiLab.app"
          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          ditto "$APP" build/ipa/Payload/BonsaiLab.app

          cat > build/BUILD_INFO.txt <<'INFO'
          Bonsai iPad Lab v1 RC1.26 Build 98 M5 FA-vec one-shot A/B
          Prism: prism-b10743-adfffbe
          Main model target: Ternary-Bonsai-2-27B-PTQ1_0.gguf
          Vision: MLX Vision Sidecar + cached projected injection
          Build 84 preserves the Build 82 effective runtime policy and patches Prism only for Qwen3.5 Metal KV at >=32K, allocating each full-attention layer KV in its own backend buffer.
          Build 85 follows Build 84 real-device evidence: model mmap/load completes with ~4974 MiB available but llama_init_from_model terminates. Prism groups Metal attention KV by buffer type into one owned MTLBuffer; Build 83 shards that allocation per full-attention layer only for Qwen3.5 >=32K.
          Build98 experiment A0 is original Prism; A1/A2 affect only matching Apple M5 GPU, Q4_0 KV, decode Q=1, dk/dv=256, KV >=1024. Candidate is one-shot and reverts on next app launch.\n          Model and Vision Tower weights are NOT bundled in the IPA.
          INFO
          echo "Commit: $GITHUB_SHA" >> build/BUILD_INFO.txt
          echo "Workflow run: $GITHUB_RUN_ID" >> build/BUILD_INFO.txt

          cd build/ipa
          zip -qry ../BonsaiLab-v1-RC1.26-build98-m5-fa-vec-ab-unsigned.ipa Payload
          cd ../..
          shasum -a 256 build/BonsaiLab-v1-RC1.26-build98-m5-fa-vec-ab-unsigned.ipa | tee build/BonsaiLab-v1-RC1.26-build98-m5-fa-vec-ab-unsigned.ipa.sha256


name: FlashNextP0

options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

packages:
  MLXSwift:
    url: https://github.com/ml-explore/mlx-swift
    exactVersion: 0.32.3

targets:
  FlashNextP0:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.bonsai.flashnext.p0
        PRODUCT_NAME: FlashNextP0
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_MACCATALYST: NO
        SWIFT_VERSION: "6.0"
        SWIFT_OBJC_BRIDGING_HEADER: "Sources/FlashNextSystemProbe.h"
        INFOPLIST_KEY_CFBundleDisplayName: "FlashNext P0"
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
    dependencies:
      - package: MLXSwift
        product: MLX
      - sdk: Metal.framework
      - sdk: Foundation.framework

schemes:
  FlashNextP0:
    build:
      targets:
        FlashNextP0: all
    run:
      config: Debug
    archive:
      config: Release
